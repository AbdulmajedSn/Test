# ALIGN — color theme (Light + Dark)
#
# primaryColor (#b7d591) is Streamlit's accent color for any button/widget
# marked type="primary" in the code. In this app, that's currently only the
# "Continue as Achiever" and "⬅ Switch Role" buttons — every other button
# uses Streamlit's default (unstyled) look. The sidebar and all other
# backgrounds are left at Streamlit's own defaults — no custom color there.
# The person viewing the app can still switch between Light and Dark
# anytime via ☰ (top-right menu) → Settings → Theme.
# Functional colors used elsewhere in the app (e.g. the red/yellow/green
# burnout-risk indicators on the heatmap) are intentionally left untouched
# since they carry specific meaning and shouldn't be re-themed.

[theme.light]
primaryColor = "#95c366"
backgroundColor = "#FFFFFF"
textColor = "#262730"
font = "sans serif"

[theme.dark]
primaryColor = "#95c366"
backgroundColor = "#0E1117"
textColor = "#FFFFFF"
font = "sans serif"
